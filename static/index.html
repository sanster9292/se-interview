<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .chat-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            min-height: 200px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: #667eea;
            color: white;
            margin-left: 20%;
            text-align: right;
        }

        .assistant-message {
            background: white;
            color: #333;
            margin-right: 20%;
            border: 1px solid #e0e0e0;
            line-height: 1.6;
        }

        .assistant-message strong {
            color: #667eea;
            font-weight: 600;
        }

        .assistant-message br {
            display: block;
            content: "";
            margin: 8px 0;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.5;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .examples {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .examples h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .example-button {
            display: inline-block;
            padding: 6px 12px;
            margin: 5px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 AI Travel Companion</h1>
        <p class="subtitle">Your intelligent assistant for weather forecasts and travel information!</p>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <div class="empty-state-icon">✈️</div>
                <p>Ask me about weather, destinations, or any travel-related questions!</p>
            </div>
        </div>

        <div class="input-container">
            <textarea
                id="messageInput"
                placeholder="What's the weather like in Paris?"
                autocomplete="off"
                rows="1"
            ></textarea>
            <button id="sendButton">Send</button>
        </div>

        <div class="examples">
            <h3>Try these examples:</h3>
            <span class="example-button" onclick="setExample('What is the weather like in Tokyo?')">
                Tokyo weather
            </span>
            <span class="example-button" onclick="setExample('Will it rain in London today?')">
                London forecast
            </span>
            <span class="example-button" onclick="setExample('What is the capital of France?')">
                General question
            </span>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        let isLoading = false;

        function clearEmptyState() {
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
        }

        function formatResponse(content) {
            // Format paragraphs
            let formatted = content.replace(/\n\n/g, '<br><br>');
            formatted = formatted.replace(/\n/g, '<br>');

            // Format bullet points
            formatted = formatted.replace(/•\s/g, '<br>• ');
            formatted = formatted.replace(/\*\s/g, '<br>• ');

            // Format numbered lists
            formatted = formatted.replace(/(\d+\.\s)/g, '<br>$1');

            // Format temperature and weather data
            formatted = formatted.replace(/(\d+\.?\d*°[CF])/g, '<strong>$1</strong>');

            // Format location names (capitalized words at start of sentences)
            formatted = formatted.replace(/(^|\. )([A-Z][a-z]+(\s[A-Z][a-z]+)*)/g, '$1<strong>$2</strong>');

            return formatted;
        }

        function addMessage(content, isUser = false) {
            clearEmptyState();
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;

            if (isUser) {
                messageDiv.textContent = content;
            } else {
                messageDiv.innerHTML = formatResponse(content);
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            isLoading = true;
            sendButton.disabled = true;
            sendButton.innerHTML = '<span class="loading"></span>';

            addMessage(message, true);
            messageInput.value = '';
            autoResize();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error('Failed to get response');
                }

                const data = await response.json();
                addMessage(data.response, false);
            } catch (error) {
                addMessage('Sorry, there was an error processing your request. Please try again.', false);
                console.error('Error:', error);
            } finally {
                isLoading = false;
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
            }
        }

        function setExample(text) {
            messageInput.value = text;
            autoResize();
            messageInput.focus();
        }

        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = messageInput.scrollHeight + 'px';
        }

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('input', autoResize);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
